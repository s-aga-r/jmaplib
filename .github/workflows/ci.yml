name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (src, strict)
        run: uv run mypy --strict src/
      - name: mypy (tests)
        # tests/__init__.py must exist for the [[tool.mypy.overrides]] "tests.*"
        # rule to match; without it mypy resolves modules as `unit.test_x` and the
        # relaxed settings silently do not apply.
        run: uv run mypy tests/
      - name: pyright
        run: uv run pyright src/
      - name: public API is fully typed
        run: uv run pyright --verifytypes jmap --ignoreexternal
      - name: layering contract
        run: uv run lint-imports

  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Spot-check the other platforms on one version rather than a full matrix.
          - python: "3.13"
            os: macos-latest
          - python: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - name: unit + wire + fake tests
        run: uv run pytest -m "not integration" --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  integration:
    name: live Stalwart
    runs-on: ubuntu-latest
    # NOT yet gating. The v0.16 headless bootstrap is unsolved: STALWART_RECOVERY_ADMIN
    # is ignored when passed as a process env var, and the printed temporary password is
    # rejected over both Basic auth and the OAuth device flow. See docs/stalwart-spike.md.
    # Flip continue-on-error to false the moment scripts/stalwart-bootstrap.sh works.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: start Stalwart
        run: |
          docker run -d --name stalwart \
            -p 8080:8080 \
            -e STALWART_PUBLIC_URL=http://localhost:8080 \
            -v stalwart-etc:/etc/stalwart \
            -v stalwart-data:/var/lib/stalwart \
            stalwartlabs/stalwart:v0.16.17
          # Named volumes, not bind mounts: the image runs as UID/GID 2000.

      - name: bootstrap and provision test accounts
        run: ./scripts/stalwart-bootstrap.sh
        env:
          STALWART_URL: http://localhost:8080

      - name: integration suite
        run: uv run pytest -m integration
        env:
          # Points at .well-known so the redirect (307 on Stalwart, 302 on Fastmail)
          # and Authorization-header survival are exercised for real.
          JMAP_TEST_URL: http://localhost:8080/.well-known/jmap
          JMAP_TEST_USER: alice@example.com
          JMAP_TEST_PASS: ${{ env.ALICE_PASSWORD }}

      - name: server logs on failure
        if: failure()
        run: docker logs stalwart
