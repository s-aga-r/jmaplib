name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  # Not a secret. It pins the temporary administrator of a throwaway container
  # that exists for the ninety seconds of one job, on a port bound to the runner.
  # Pinning it is what makes the bootstrap deterministic instead of a log scrape.
  STALWART_RECOVERY_ADMIN_PASS: "ci-bootstrap-only"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (src, strict)
        run: uv run mypy --strict src/
      - name: mypy (tests)
        # tests/__init__.py must exist for the [[tool.mypy.overrides]] "tests.*"
        # rule to match; without it mypy resolves modules as `unit.test_x` and the
        # relaxed settings silently do not apply.
        run: uv run mypy tests/
      - name: pyright
        run: uv run pyright src/
      - name: public API is fully typed
        run: uv run pyright --verifytypes jmap --ignoreexternal
      - name: layering contract
        run: uv run lint-imports

  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        include:
          # Spot-check the other platforms on one version rather than a full matrix.
          - python: "3.13"
            os: macos-latest
          - python: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - name: unit + wire + fake tests
        # Coverage is gated at 100% via [tool.coverage.report] fail_under.
        run: uv run pytest -m "not integration" --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  integration:
    name: live Stalwart
    runs-on: ubuntu-latest
    # Still non-gating while the end-to-end run is being proven in CI - the
    # bootstrap chain is solved and verified locally, but "verified locally"
    # is exactly the claim that hid a Python 3.11 failure here for months.
    # Flip to false once this job has been green for a few consecutive runs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras

      - name: start Stalwart
        run: |
          # No config file is mounted or created: bootstrap mode triggers *only*
          # when the server finds none, and providing one is what kept this
          # unsolved. STALWART_RECOVERY_ADMIN pins the temporary credential so
          # the flow is deterministic rather than scraped from the log.
          docker run -d --name stalwart \
            -p 8080:8080 \
            -e STALWART_PUBLIC_URL=http://localhost:8080 \
            -e STALWART_RECOVERY_ADMIN="admin:${STALWART_RECOVERY_ADMIN_PASS}" \
            -v stalwart-data:/var/lib/stalwart \
            stalwartlabs/stalwart:v0.16.17
          # A named volume, not a bind mount: the image runs as UID/GID 2000.
        env:
          STALWART_RECOVERY_ADMIN_PASS: ${{ env.STALWART_RECOVERY_ADMIN_PASS }}

      - name: bootstrap and provision test accounts
        run: ./scripts/stalwart-bootstrap.sh
        env:
          STALWART_URL: http://localhost:8080
          STALWART_CONTAINER: stalwart
          STALWART_RECOVERY_ADMIN_PASS: ${{ env.STALWART_RECOVERY_ADMIN_PASS }}

      - name: integration suite
        run: uv run pytest -m integration
        env:
          # Points at .well-known so the redirect (307 on Stalwart, 302 on Fastmail)
          # and Authorization-header survival are exercised for real.
          JMAP_TEST_URL: http://localhost:8080/.well-known/jmap
          JMAP_TEST_USER: alice@example.com
          JMAP_TEST_PASS: ${{ env.ALICE_PASSWORD }}
          # Bob exists so the delivery test - alice sends, bob receives - is not
          # skipped. It is the one assertion the fake server cannot make.
          JMAP_TEST_USER2: bob@example.com
          JMAP_TEST_PASS2: ${{ env.BOB_PASSWORD }}

      - name: conformance matrix
        # Only when the bootstrap actually produced a credential; running it with
        # an empty password just prints an authentication failure.
        if: env.ALICE_PASSWORD != ''
        run: |
          uv run python -m jmap.testing.conformance \
            http://localhost:8080/.well-known/jmap \
            --user alice@example.com --password "${{ env.ALICE_PASSWORD }}" \
            --markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: server logs on failure
        if: failure()
        run: docker logs stalwart
