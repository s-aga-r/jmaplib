name: Release

on:
  push:
    tags: ["v*"]

# Trusted Publishing: no API token stored anywhere. PyPI verifies the OIDC identity
# of this workflow, so `id-token: write` is what actually authorises the upload.
permissions:
  contents: read

jobs:
  ci:
    # The whole CI gate on the tagged commit: lint, formatting, both type
    # checkers, every Python in the matrix with its 100% coverage floor, and the
    # live Stalwart suite. The gate here used to be a bare `pytest`, which is how
    # 1.1.0 was published from a commit whose CI was red - formatting and
    # coverage failed, and `pytest` alone checks neither.
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'from jmap.__about__ import __version__; print(__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match __version__ $pkg"
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jmaplib
    permissions:
      # id-token alone is what signs and authorises. `attestations: write` was
      # only ever for the GitHub attestation store, which this repository cannot
      # use while it is private.
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # No separate actions/attest-build-provenance step. It was doing the job
      # twice and only one of the two can work here: that action writes to
      # GitHub's own attestation store, which is unavailable on a user-owned
      # *private* repository and fails the whole release with "please make this
      # repository public". The publish action below already produces the PEP 740
      # attestations PyPI actually records, signing each distribution with
      # Sigstore under the same OIDC identity that authorises the upload - so
      # provenance is not lost by dropping the step, only duplication is.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
